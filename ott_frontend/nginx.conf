server {
  listen 80;
  server_name _;

  # Allow requests for static assets and index.html
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    # For accessing backend APIs, proxy /api/* to the backend (uncomment and configure as needed)
    # location /api/ {
    #   proxy_pass http://ott_backend:8000;
    #   proxy_set_header Host $host;
    # }
  }

  # Optional: gzip static assets for faster load
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
